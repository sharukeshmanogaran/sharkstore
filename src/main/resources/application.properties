spring.application.name=SharkStore
server.port=${PORT:8080}

# Database (defaults to local H2; switches to PostgreSQL via environment variables in cloud)
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/sharkstoredb;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DATABASE_USER:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Web Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT & CORS Security
sharkstore.jwt.secret=${JWT_SECRET:536861726B53746F726546726565456E74657270726973655365637265744B6579}
sharkstore.jwt.expiration-ms=86400000
sharkstore.frontend.url=${FRONTEND_URL:*}

# Swagger / OpenAPI 3 Interactive Docs
springdoc.swagger-ui.path=/swagger-ui.html